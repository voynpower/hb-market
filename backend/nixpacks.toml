[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
# Ensure the server listens on the PORT provided by Railway
cmd = "npx prisma generate && npx prisma db push --accept-data-loss && node dist/main"
